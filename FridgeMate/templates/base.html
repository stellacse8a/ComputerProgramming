<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FridgeMate · 나의 냉장고 친구</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><script defer src="{{ url_for('static',filename='app.js') }}"></script></head><body><main class="app"><header><a class="brand" href="/">Fridge<span>Mate</span><i>●</i></a><a class="bell" href="/notifications" aria-label="알림"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5z"/><path d="M10 20h4"/></svg>{% if unread %}<b>{{ unread }}</b>{% endif %}</a></header>{% for message in get_flashed_messages() %}<div class="toast" role="status">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}<footer>냉장고 속 작은 관리, 더 나은 일상.</footer></main><nav class="bottom" aria-label="하단 메뉴"><a class="{{ 'active' if tab=='home' }}" href="/">⌂<span>홈</span></a><a class="{{ 'active' if tab=='fridge' }}" href="/fridge">▤<span>냉장고</span></a><a class="add-tab {{ 'active' if tab=='add' }}" href="/add">＋<span>식품 추가</span></a><a class="{{ 'active' if tab=='notifications' }}" href="/notifications">♧<span>알림{% if unread %} · {{ unread }}{% endif %}</span></a></nav><dialog id="confirm-dialog"><h2>처리할까요?</h2><p id="confirm-text"></p><div class="row"><button type="button" id="cancel-confirm" class="secondary">취소</button><button type="button" id="accept-confirm">확인</button></div></dialog></body></html>
